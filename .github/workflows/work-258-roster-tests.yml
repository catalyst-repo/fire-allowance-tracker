name: WORK-258 roster engine tests
on:
  pull_request:
    branches: [dev]
    paths:
      - "lib/roster/**"
      - "lib/platoon/resolveOperationalPlatoon.js"
      - "tests/roster.test.ts"
      - ".github/workflows/work-258-roster-tests.yml"
  workflow_dispatch:
jobs:
  roster-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test roster engine
        run: node --experimental-strip-types --test tests/roster.test.ts
