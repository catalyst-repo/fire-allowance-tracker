name: WORK-258 Roster Tests
on:
  pull_request:
    branches: [dev]
    paths:
      - 'lib/roster/**'
      - 'lib/platoon/**'
      - 'app/api/roster/**'
      - 'app/roster/**'
      - 'neon/migrations/*roster*'
      - 'neon/rollbacks/*roster*'
      - 'neon/verify/*roster*'
      - 'tests/roster*'
      - '.github/workflows/work-258-roster.yml'
  push:
    branches: [dev]
    paths:
      - 'lib/roster/**'
      - 'lib/platoon/**'
      - 'app/api/roster/**'
      - 'app/roster/**'
      - 'neon/migrations/*roster*'
      - 'neon/rollbacks/*roster*'
      - 'neon/verify/*roster*'
      - 'tests/roster*'
      - '.github/workflows/work-258-roster.yml'
jobs:
  roster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: P1 roster engine
        run: node --experimental-strip-types --test tests/roster.test.ts
      - name: P2 fail-closed gate and schema contract
        run: node --test tests/roster-gate.test.mjs tests/roster-p2-contract.test.mjs
