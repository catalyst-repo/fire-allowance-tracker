name: WORK-258 Roster Tests
on:
  pull_request:
    branches: [dev]
    paths:
      - 'lib/roster/**'
      - 'lib/platoon/**'
      - 'tests/roster.test.ts'
      - '.github/workflows/work-258-roster.yml'
  push:
    branches: [dev]
    paths:
      - 'lib/roster/**'
      - 'lib/platoon/**'
      - 'tests/roster.test.ts'
      - '.github/workflows/work-258-roster.yml'
jobs:
  roster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Roster regression tests
        run: node --experimental-strip-types --test tests/roster.test.ts
